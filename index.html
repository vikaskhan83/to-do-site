<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="mainbox">

        <div id="heading">
            <h1>Task Manager</h1>
        </div>

        <div id="inputmenu">
            <input id="inputtext" type="text" placeholder="What You Need To Do ?">
            <input id="button" type="button" value="Add Task">
        </div>

        <div id="remainder">
            <h1>Your Tasks</h1>
        </div>

    </section>





    <script src="script.js"></script>
</body>
</html>
